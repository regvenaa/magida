<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>მაგიდა — დაჯავშნე მაგიდა</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Noto Sans Georgian', sans-serif;
      background: #000000;
      color: #f5f5f5;
    }
    header {
      background: #8B1E3F;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 26px; }
    .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .clock { font-size: 16px; font-variant-numeric: tabular-nums; }
    .lang button {
      background: transparent;
      color: white;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }
    .lang button.active { background: white; color: #8B1E3F; }
    .hero { text-align: center; padding: 40px 20px 20px; }
    .hero h2 { font-size: 28px; color: #E8A0B4; margin: 0 0 10px; }
    .section-title { color: #E8A0B4; padding: 0 20px; margin: 36px 0 14px; font-size: 22px; }
    .filters { display: flex; gap: 10px; padding: 0 20px; flex-wrap: wrap; }
    .filters button {
      background: #1c1c1c;
      color: #f5f5f5;
      border: 1px solid #333;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
    }
    .filters button.active { background: #8B1E3F; border-color: #8B1E3F; }
    .restaurants {
      display: flex;
      flex-wrap: nowrap;
      gap: 20px;
      padding: 20px;
      overflow-x: auto;
    }
    .card {
      flex: 1;
      min-width: 220px;
      background: #1c1c1c;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(255,255,255,0.08);
    }
    .card h3 { margin: 10px 0 6px; }
    .card p { color: #bbbbbb; margin: 0 0 14px; }
    .card button {
      background: #8B1E3F;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      background: #2a2a2a;
      color: #E8A0B4;
      padding: 3px 10px;
      border-radius: 12px;
    }
    #map { height: 400px; margin: 0 20px; border-radius: 12px; }
    .popup-title { font-weight: 700; }
    .weather { display: flex; gap: 12px; padding: 0 20px; overflow-x: auto; }
    .day {
      flex: 1;
      min-width: 90px;
      background: #1c1c1c;
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
    }
    .day-name { font-weight: 700; }
    .day-date { font-size: 12px; color: #999999; }
    .icon { font-size: 30px; margin: 8px 0; }
    .temp span { color: #999999; }
    .empty { color: #999999; padding: 0 20px; }
    footer {
      background: #1c1c1c;
      color: #aaaaaa;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <!-- ზედა ზოლი: სახელი, თბილისის დრო, ენის გადამრთველი -->
  <header>
    <h1>🍽️ <span data-i18n="brand">მაგიდა</span></h1>
    <div class="header-right">
      <div class="clock">🕒 <span data-i18n="tbilisi">თბილისი</span> <span id="clock">--:--:--</span></div>
      <div class="lang">
        <button id="btn-ka" onclick="setLang('ka')">GEO</button>
        <button id="btn-en" onclick="setLang('en')">ENG</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <h2 data-i18n="heroTitle">დაჯავშნე მაგიდა საქართველოს რესტორნებში</h2>
    <p data-i18n="heroText">რესტორნები, ბარები და კაფეები — ერთ ადგილას</p>
  </section>

  <!-- სამზარეულოს ფილტრი -->
  <h2 class="section-title" data-i18n="cuisineTitle">სამზარეულო</h2>
  <div class="filters">
    <button class="active" data-cuisine="all" data-i18n="all" onclick="filterCuisine('all')">ყველა</button>
    <button data-cuisine="georgian" data-i18n="georgian" onclick="filterCuisine('georgian')">ქართული</button>
    <button
